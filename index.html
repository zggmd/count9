<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>数九 · 日签</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#9a4b18">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        :root {
            --paper: #fbf7ef;
            --ink: #2f2f2f;
            --sub: #8a8f98;
            --border: #9a4b18;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3efe6;
            font-family: "Songti SC","STSong","SimSun",serif;
            color: var(--ink);
        }

        .card {
            width: min(92vw, 420px);
            aspect-ratio: 3 / 4;
            background: var(--paper);
            border-radius: 14px;
            padding: 26px 22px;
            position: relative;
            box-shadow: 0 12px 40px rgba(0,0,0,.08);
        }

        .card::before,
        .card::after {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 10px;
            pointer-events: none;
        }

        .card::before { border: 2px solid var(--border); }
        .card::after  { inset: 14px; border: 1px solid var(--border); opacity: .7; }

        .content {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .title {
            font-size: 18px;
            letter-spacing: .35em;
        }

        .date {
            margin-top: 12px;
            font-size: 14px;
            letter-spacing: .15em;
            color: var(--sub);
        }

        /* 【新增-农历】 */
        .lunar {
            margin-top: 6px;
            font-size: 13px;
            letter-spacing: .2em;
            color: #6b7280;
        }

        .result {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
        }

        .main {
            font-size: 60px;
            letter-spacing: .4em;
            padding-left: .4em;
        }

        .sub {
            font-size: 24px;
            letter-spacing: .25em;
        }

        .desc {
            margin-top: 14px;
            font-size: 16px;
            letter-spacing: .2em;
        }

        .timeline {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 14px;
            margin-top: 6px;
        }

        .timeline span {
            cursor: pointer;
            transition: opacity .3s, color .3s;
            color: #9aa1aa;
        }

        .timeline span.past { opacity: .25; }
        .timeline span.current {
            color: var(--ink);
            font-weight: 600;
        }
        .timeline span.active {
            color: var(--ink);
            text-decoration: underline;
        }

        .divider {
            width: 70%;
            margin: 16px auto 14px;
            border-top: 1px dashed #c9cdd4;
        }

        .footer {
            font-size: 14px;
            line-height: 1.8;
            color: #6b7280;
        }

        .watermark {
            position: absolute;
            right: 24px;
            bottom: 36px;
            font-size: 96px;
            color: rgba(0,0,0,.04);
            pointer-events: none;
        }

        .fade {
            animation: fadeIn .25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>

<body>
<div class="card">
    <div class="content">
        <div class="title">数 九</div>
        <div id="date" class="date"></div>
        <!-- 【新增-农历】 -->
        <div id="lunar" class="lunar"></div>

        <div class="result">
            <div id="main" class="main"></div>
            <div id="sub" class="sub"></div>
            <div id="desc" class="desc"></div>
        </div>

        <div id="timeline" class="timeline"></div>

        <div class="divider"></div>

        <div class="footer">
            冬至当日为初九<br />
            九尽桃花开，春回大地
        </div>
    </div>

    <div class="watermark">冬至</div>
</div>

<script>
  /************** 【修正-农历算法】开始 **************/

/*
  农历算法范围：1900-2100
  基准：1900-01-31 为农历 1900 正月初一
*/

const lunarInfo = [
0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,
0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
0x05aa0,0x076a3,0x096d0,0x04bd7,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0
];

const Gan = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const Zhi = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const lunarMonthCN = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];
const lunarDayCN = [
"初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
"十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
"廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"
];

function lunarYearDays(y){
  let sum = 348;
  for(let i=0x8000;i>0x8;i>>=1){
    sum += (lunarInfo[y-1900] & i)?1:0;
  }
  return sum + leapDays(y);
}

function leapMonth(y){
  return lunarInfo[y-1900] & 0xf;
}

function leapDays(y){
  if(leapMonth(y)){
    return (lunarInfo[y-1900] & 0x10000)?30:29;
  }
  return 0;
}

function monthDays(y,m){
  return (lunarInfo[y-1900] & (0x10000>>m))?30:29;
}

function getLunar(date){
  const baseDate = new Date(1900,0,31);
  let offset = Math.floor((date - baseDate)/86400000);

  let year,month,day;
  for(year=1900;year<2100 && offset>0;year++){
    let temp = lunarYearDays(year);
    offset -= temp;
  }
  if(offset<0){
    offset += lunarYearDays(--year);
  }

  let leap = leapMonth(year);
  let isLeap = false;

  for(month=1;month<=12 && offset>0;month++){
    let temp;
    if(leap>0 && month==(leap+1) && !isLeap){
      --month;
      isLeap = true;
      temp = leapDays(year);
    }else{
      temp = monthDays(year,month);
    }

    if(isLeap && month==(leap+1)) isLeap=false;
    offset -= temp;
  }

  if(offset<0){
    offset += monthDays(year,--month);
  }

  day = offset+1;

  const gz = Gan[(year-4)%10]+Zhi[(year-4)%12];

  return `${gz}年 ${isLeap?"闰":""}${lunarMonthCN[month-1]}月${lunarDayCN[day-1]}`;
}

/************** 【修正-农历算法】结束 **************/


  /******** 天文冬至（原样保留） ********/
  const J2000 = 2451545;
  const toJulian = d => d / 86400000 + 2440587.5;
  const fromJulian = jd => new Date((jd - 2440587.5) * 86400000);

  function solarLongitude(jd) {
    const T = (jd - J2000) / 36525;
    const L0 = 280.46646 + 36000.76983 * T;
    const M = 357.52911 + 35999.05029 * T;
    const C =
      (1.914602 - 0.004817 * T) * Math.sin(M * Math.PI / 180) +
      0.019993 * Math.sin(2 * M * Math.PI / 180);
    return (L0 + C) % 360;
  }

  function getDongzhi(year) {
    let jd = toJulian(new Date(Date.UTC(year, 11, 21, 12)));
    let delta;
    do {
      const lon = solarLongitude(jd);
      delta = (lon - 270 + 360) % 360;
      if (delta > 180) delta -= 360;
      jd -= delta / 360 * 365.2422;
    } while (Math.abs(delta) > 1e-6);
    return fromJulian(jd);
  }

  /******** 数九原逻辑（完整保留） ********/
  const cn = ["一","二","三","四","五","六","七","八","九"];
  const sayings = [
    "一九二九不出手",
    "一九二九不出手",
    "三九四九冰上走",
    "三九四九冰上走",
    "五九六九沿河看柳",
    "五九六九沿河看柳",
    "七九河开",
    "八九雁来",
    "九九加一九，耕牛遍地走"
  ];

  let currentJiu = null;
  let currentDay = null;

  function calcShuJiu(today) {
    let dz = getDongzhi(today.getFullYear());
    if (today < dz) dz = getDongzhi(today.getFullYear() - 1);
    const diff = Math.floor((today - dz) / 86400000);
    if (diff < 0 || diff >= 81) return null;
    return { jiu: Math.floor(diff / 9), day: diff % 9 + 1 };
  }

  function renderMain(jiu, day = null) {
    const main = document.getElementById("main");
    const desc = document.getElementById("desc");

    main.classList.remove("fade");
    desc.classList.remove("fade");
    void main.offsetWidth;

    main.textContent = cn[jiu] + " 九";
    desc.textContent = sayings[jiu];

    main.classList.add("fade");
    desc.classList.add("fade");

    const sub = document.getElementById("sub");
    if (day) {
      sub.textContent = `第 ${day} 天`;
      sub.style.visibility = "visible";
    } else {
      sub.style.visibility = "hidden";
    }
  }

  function init() {
    const today = new Date();
    document.getElementById("date").textContent =
      `${today.getFullYear()} 年 ${today.getMonth()+1} 月 ${today.getDate()} 日`;

    /* 【新增-农历渲染】 */
    document.getElementById("lunar").textContent = getLunar(today);

    const res = calcShuJiu(today);
    if (!res) return;

    currentJiu = res.jiu;
    currentDay = res.day;
    renderMain(currentJiu, currentDay);

    const timeline = document.getElementById("timeline");
    timeline.innerHTML = "";

    cn.forEach((n, i) => {
      const span = document.createElement("span");
      span.textContent = n + "九";

      if (i < currentJiu) span.classList.add("past");
      if (i === currentJiu) span.classList.add("current");

      span.onclick = () => {
        document.querySelectorAll(".timeline span").forEach(s =>
          s.classList.remove("active")
        );
        span.classList.add("active");

        if (i === currentJiu) {
          renderMain(currentJiu, currentDay);
        } else {
          renderMain(i);
        }
      };

      timeline.appendChild(span);
    });
  }

  init();
</script>
<script>
  /* ================== 【PWA 新增 2】 ================== */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {

</script>
</body>
</html>
